name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
permissions:
  id-token: write  # Required for OIDC
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        scope: '@variocube'
    - run: npm ci

    # On a GitHub Release, stamp the version from the release tag into every
    # package (the repo itself stays at 0.0.0). Tag may be `1.2.3` or `v1.2.3`.
    - if: github.event_name == 'release'
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        # The release event checks out a detached HEAD; put it on a throwaway
        # branch so lerna is happy. The stamped versions are committed on that
        # branch only (lerna publish refuses a dirty working tree); nothing is
        # ever pushed.
        git checkout -B release-build
        npx lerna version "$VERSION" --no-git-tag-version --no-push --force-publish --yes
        git -c user.name="github-actions" -c user.email="github-actions@github.com" \
          commit -am "v$VERSION (release build only, never pushed)"

    - run: npm run build
    - run: npm run test
    - run: npm run typecheck
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser

    # `--pre-dist-tag` only applies to versions carrying a prerelease identifier
    # (2.0.0-rc.1), so a release candidate lands on `next` while full releases
    # keep going to `latest`. Without it lerna falls back to npm's default tag
    # and an RC would become `latest` for every consumer.
    - if: github.event_name == 'release'
      run: npx lerna publish from-package --yes --no-private --pre-dist-tag next

    # The published demo tracks what `latest` installs, so pre-releases skip it.
    - if: github.event_name == 'release' && !github.event.release.prerelease
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: ./packages/cube-app-demo/dist # The folder the action should deploy.
